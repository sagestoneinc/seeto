<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{page.title}}</title>
<meta name="description" content="{{page.description}}">
<link rel="canonical" href="{{site.baseUrl}}{{page.canonical}}">
<meta name="robots" content="{{page.robots}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{site.name}}">
<meta property="og:title" content="{{page.title}}">
<meta property="og:description" content="{{page.description}}">
<meta property="og:url" content="{{site.baseUrl}}{{page.canonical}}">
<meta property="og:image" content="{{site.baseUrl}}{{page.ogImage}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{page.title}}">
<meta name="twitter:description" content="{{page.description}}">
<meta name="twitter:image" content="{{site.baseUrl}}{{page.ogImage}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Zilla+Slab:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/images/brand/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/images/brand/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png">
<meta name="theme-color" content="#8E1B1B">
<link rel="stylesheet" href="/css/style.css">
<script type="application/ld+json">{{{page.schema}}}</script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
{{{partials.header}}}
<main id="main">
{{{page.content}}}
</main>
{{{partials.footer}}}
{{{partials.chatbot}}}
<script src="/js/main.js"></script>
</body>
</html>
